        const TonesNoria = ({ onComplete, progress, onBack }) => {
            const [scrollPos, setScrollPos] = useState(0);
            const maxScroll = dbTones.length - 1;

            const [selectedCards, setSelectedCards] = useState([]);
            const [shakeCardId, setShakeCardId] = useState(null);
            const [limitWarning, setLimitWarning] = useState(false);

            const containerRef = useRef(null);
            const touchStartX = useRef(null);
            const touchStartY = useRef(null);
            const lastScrollPos = useRef(0);
            const isDragging = useRef(false);

            const DRAG_SENSITIVITY = window.innerWidth * 0.5;
            const MAX_SELECTIONS = 5;

            useEffect(() => {
                window.scrollTo(0, 0);
            }, []);

            useEffect(() => {
                const container = containerRef.current;
                if (!container) return;
                const handleWheel = (e) => {
                    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
                        e.preventDefault(); 
                        setScrollPos(prev => {
                            let newPos = prev + (e.deltaX * 0.002);
                            return Math.max(0, Math.min(maxScroll, newPos));
                        });
                    }
                };
                container.addEventListener('wheel', handleWheel, { passive: false });
                return () => container.removeEventListener('wheel', handleWheel);
            }, [maxScroll]);

            const handleDragStart = (clientX, clientY) => { 
                touchStartX.current = clientX; 
                touchStartY.current = clientY; 
                lastScrollPos.current = scrollPos;
                isDragging.current = false;
            };

            const handleDragMove = (clientX, clientY) => {
                if (touchStartX.current !== null && touchStartY.current !== null) {
                    const diffX = clientX - touchStartX.current;
                    const diffY = clientY - touchStartY.current;
                    if (Math.abs(diffY) > Math.abs(diffX) + 5 && !isDragging.current) {
                        touchStartX.current = null; 
                        return;
                    }
                    if (Math.abs(diffX) > 5) isDragging.current = true;
                    let newPos = lastScrollPos.current - (diffX / DRAG_SENSITIVITY);
                    newPos = Math.max(0, Math.min(maxScroll, newPos));
                    setScrollPos(newPos);
                }
            };

            const handleDragEnd = () => {
                touchStartX.current = null;
                touchStartY.current = null;
                setTimeout(() => { isDragging.current = false; }, 50);
            };

            const toggleSelection = (cardId) => {
                if (isDragging.current) return;
                if (selectedCards.includes(cardId)) {
                    setSelectedCards(prev => prev.filter(id => id !== cardId));
                } else {
                    if (selectedCards.length < MAX_SELECTIONS) {
                        setSelectedCards(prev => [...prev, cardId]);
                    } else {
                        setShakeCardId(cardId);
                        setLimitWarning(true);
                        setTimeout(() => setLimitWarning(false), 2200);
                        setTimeout(() => setShakeCardId(null), 400);
                    }
                }
            };

            const getGroupStyles = (index) => {
                const offset = index - scrollPos;
                const translateX = offset * 90; 
                const rotateY = offset * -18; 
                const scale = 1 - Math.min(Math.abs(offset) * 0.15, 0.3); 
                const translateZ = Math.min(Math.abs(offset) * -120, 0); 
                const zIndex = 20 - Math.round(Math.abs(offset) * 10);
                return {
                    transform: `translateX(${translateX}%) scale(${scale}) translateZ(${translateZ}px) rotateY(${rotateY}deg)`,
                    opacity: 1, 
                    zIndex: zIndex
                };
            };

            return (
                <>
                    <div className="w-full min-h-screen flex flex-col pb-48 fade-in relative">
                        <GlobalHeader progress={progress} onBack={onBack} />
                        
                        <div className={`fixed top-8 left-1/2 -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded-full font-semibold text-sm shadow-[0_10px_30px_rgba(239,68,68,0.3)] transition-all duration-300 z-[200] flex items-center gap-2 ${limitWarning ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-4 pointer-events-none'}`}>
                            Máximo {MAX_SELECTIONS} selecciones
                        </div>

                        <div className="w-full px-6 pt-28 pb-4 text-center z-20 pointer-events-none mt-4">
                            <h2 className="text-2xl md:text-3xl font-semibold tracking-tight text-gray-900 mb-2">
                                ¿Qué tono quieres que tenga la cena?
                            </h2>
                            <p className="text-sm font-medium text-gray-500">
                                Selecciona hasta {MAX_SELECTIONS} tonos
                            </p>
                        </div>

                        <div 
                            className="ferris-wheel-container"
                            ref={containerRef}
                            onTouchStart={(e) => handleDragStart(e.touches[0].clientX, e.touches[0].clientY)}
                            onTouchMove={(e) => handleDragMove(e.touches[0].clientX, e.touches[0].clientY)}
                            onTouchEnd={handleDragEnd}
                            onMouseDown={(e) => handleDragStart(e.clientX, e.clientY)}
                            onMouseMove={(e) => handleDragMove(e.clientX, e.clientY)}
                            onMouseUp={handleDragEnd}
                            onMouseLeave={handleDragEnd}
                        >
                            {dbTones.map((group, groupIndex) => {
                                const groupStyles = getGroupStyles(groupIndex);
                                return (
                                    <div key={group.id} className="deck-group" style={groupStyles}>
                                        <div className="text-center mb-6">
                                            <span className="inline-block px-3 py-1 bg-gray-100 text-gray-600 rounded-full text-[10px] font-bold uppercase tracking-widest mb-2">
                                                {group.subtitle}
                                            </span>
                                            <h3 className="text-xl font-semibold text-gray-900">
                                                {group.title}
                                            </h3>
                                        </div>
                                        <div className="relative w-full flex flex-col items-center">
                                            {group.subtones.map((card, cardIndex) => {
                                                const isSelected = selectedCards.includes(card.id);
                                                const isShaking = shakeCardId === card.id;
                                                const marginTop = cardIndex > 0 ? '-1.25rem' : '0';
                                                const rotZ = [0, -1.5, 1.5, -2][cardIndex % 4];
                                                const baseZIndex = 15 - cardIndex;

                                                if (card.id === 't_custom') {
                                                    return (
                                                        <div 
                                                            key={card.id}
                                                            onClick={() => toggleSelection(card.id)}
                                                            className={`v27-card ${isSelected ? 'is-selected' : ''} ${isShaking ? 'shake-animation' : ''}`}
                                                            style={{ marginTop: marginTop, zIndex: baseZIndex, '--rot-z': `${rotZ}deg` }}
                                                        >
                                                            <input
                                                                type="text"
                                                                className={`w-full bg-transparent outline-none text-[16px] tracking-wide font-medium text-center relative z-10 transition-colors duration-700 ${isSelected ? 'text-gray-900 placeholder:text-gray-900/60' : 'text-gray-800 placeholder:text-gray-800/60'}`}
                                                                placeholder={card.text}
                                                                onClick={(e) => e.stopPropagation()}
                                                                onFocus={(e) => {
                                                                    isDragging.current = true; 
                                                                }}
                                                                onBlur={(e) => {
                                                                    isDragging.current = false;
                                                                    const val = e.target.value.trim();
                                                                    if (val !== '') {
                                                                        if (!selectedCards.includes(card.id)) {
                                                                            if (selectedCards.length < MAX_SELECTIONS) {
                                                                                setSelectedCards(prev => [...prev, card.id]);
                                                                            } else {
                                                                                setShakeCardId(card.id);
                                                                                setLimitWarning(true);
                                                                                setTimeout(() => setLimitWarning(false), 2200);
                                                                                setTimeout(() => setShakeCardId(null), 400);
                                                                            }
                                                                        }
                                                                    } else {
                                                                        if (selectedCards.includes(card.id)) {
                                                                            setSelectedCards(prev => prev.filter(id => id !== card.id));
                                                                        }
                                                                    }
                                                                }}
                                                            />
                                                        </div>
                                                    );
                                                }

                                                return (
                                                    <div 
                                                        key={card.id}
                                                        onClick={() => toggleSelection(card.id)}
                                                        className={`v27-card ${isSelected ? 'is-selected' : ''} ${isShaking ? 'shake-animation' : ''}`}
                                                        style={{ marginTop: marginTop, zIndex: baseZIndex, '--rot-z': `${rotZ}deg` }}
                                                    >
                                                        <span className={`text-[16px] tracking-wide font-medium relative z-10 transition-colors duration-700 ${isSelected ? 'text-gray-900' : 'text-gray-800'}`}>
                                                            {card.text}
                                                        </span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div className="sticky-bottom-bar pointer-events-none fade-in-opacity">
                        <div className="w-full pointer-events-auto relative z-20">
                            <CurvedSlider value={scrollPos} max={maxScroll} onChange={setScrollPos} />
                        </div>
                        <div className="pointer-events-auto w-full max-w-[320px] flex justify-center mt-2">
                            <button 
                                disabled={selectedCards.length === 0}
                                onClick={() => onComplete(selectedCards)}
                                className={`w-full px-8 py-4 rounded-full text-sm font-semibold uppercase tracking-wider transition-all duration-300 shadow-xl flex items-center justify-center gap-2
                                    ${selectedCards.length > 0 
                                        ? 'bg-black text-white hover:bg-gray-800 hover:-translate-y-0.5 active:translate-y-0' 
                                        : 'bg-gray-200 text-gray-500 cursor-not-allowed shadow-none'
                                    }`}
                            >
                                {selectedCards.length > 0 ? (
                                    <>
                                        Continuar 
                                        <span className="px-2 py-0.5 rounded-full text-[10px] bg-white text-black">
                                            {selectedCards.length} / {MAX_SELECTIONS}
                                        </span>
                                    </>
                                ) : (
                                    "Selecciona como mínimo 1 carta"
                                )}
                            </button>
                        </div>
                    </div>
                </>
            );
        };

        const CustomizationN4 = ({ onComplete, onBack, globalData, progress }) => {

                                                    onChange={(e) => handleParticipantChange(index, 'name', e.target.value)}

                                                />

                                                    <input

                                                        onChange={(e) => handleParticipantChange(index, 'role', e.target.value)}

                                                        style={{ padding: '0.6rem 1.2rem' }}

                                                    <input

                                                        onChange={(e) => handleParticipantChange(index, 'details', e.target.value)} 
                                                        className="pill-input !mb-0 text-[13px] border-black bg-white focus:bg-white text-gray-700 flex-1"
                                                        style={{ padding: '0.6rem 1.2rem' }}

                            <div>
                                <h1 className="text-3xl font-semibold tracking-tight mb-4">Tu mazo personalizado</h1>
                                <p className="text-gray-500">Hemos diseñado esta experiencia exclusivamente para tu cena basada en tus respuestas.</p>
                            </div>

                            <div className="summary-card space-y-4">
                                <div className="flex justify-between items-center pb-4 border-b border-gray-200">
                                    <div className="flex items-center gap-3">
                                        <div className="w-12 h-12 bg-black rounded-lg flex items-center justify-center text-white text-xl">🃏</div>
                                        <div>
                                            <p className="font-semibold text-sm">Sensibles: {formatName}</p>
                                            <p className="text-xs text-gray-400 italic">Personalizado para: {audLabel}</p>
                                        </div>
                                    </div>
                                    <p className="font-bold">{price}</p>
                                </div>
                                
                                <div className="space-y-2">
                                    <div className="flex justify-between text-sm text-gray-500">
                                        <span>{isDigital ? 'Envío Inmediato (Email/Web)' : `Envío a ${globalData.logistics?.ciudad || 'tu zona'}`}</span>
                                        <span className="text-green-600 font-medium">Gratis</span>
                                    </div>
                                    <div className="flex justify-between text-lg font-bold pt-2 border-t border-gray-200">
                                        <span>Total</span>
                                        <span>{price}</span>
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center gap-4 text-xs text-gray-400 font-medium uppercase tracking-wider">
                                <div className="flex items-center gap-1">🔒 Pago Seguro</div>
                                <div className="flex items-center gap-1">✨ Garantía Sensibles</div>
                            </div>
                        </div>

                        <div className="bg-white rounded-[2rem] p-8 shadow-[0_20px_50px_rgba(0,0,0,0.04)] border border-gray-100">
                            <h3 className="text-lg font-semibold mb-6">Información de Pago</h3>
                            
                            <div className="space-y-5">
                                <div className="grid grid-cols-2 gap-3 mb-6">
                                    <button className="flex items-center justify-center py-3 border border-gray-200 rounded-xl hover:bg-gray-50 transition-all">
                                        <span className="font-bold text-sm">Apple Pay</span>
                                    </button>
                                    <button className="flex items-center justify-center py-3 border border-gray-200 rounded-xl hover:bg-gray-50 transition-all">
                                        <span className="font-bold text-sm">Google Pay</span>
                                    </button>
                                </div>

                                <div className="relative flex items-center mb-6">
                                    <div className="flex-grow border-t border-gray-100"></div>
                                    <span className="flex-shrink mx-4 text-gray-300 text-[10px] font-bold uppercase tracking-widest">O tarjeta bancaria</span>
                                    <div className="flex-grow border-t border-gray-100"></div>
                                </div>

                                <div>
                                    <label className="label-pay">Número de tarjeta</label>
                                    <div className="relative">
                                        <input type="text" className="pay-input" placeholder="0000 0000 0000 0000" />
                                        <div className="absolute right-4 top-1/2 -translate-y-1/2 flex gap-1">
                                            <div className="w-6 h-4 bg-gray-100 rounded-sm"></div>
                                            <div className="w-6 h-4 bg-gray-100 rounded-sm"></div>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="label-pay">Caducidad</label>
                                        <input type="text" className="pay-input" placeholder="MM / YY" />
                                    </div>
                                    <div>
                                        <label className="label-pay">CVC</label>
                                        <input type="text" className="pay-input" placeholder="123" />
                                    </div>
                                </div>

                                <div className="pt-4">
                                    <button 
                                        onClick={handlePayment}
                                        disabled={loading}
                                        className="btn-pay shadow-lg"
                                    >
                                        {loading ? (
                                            <div className="spinner"></div>
                                        ) : (
                                            <>Pagar {price}</>
                                        )}
                                    </button>
                                </div>

                                <p className="text-[10px] text-gray-400 text-center px-4 leading-relaxed mt-4">
                                    Al confirmar el pago, aceptas nuestros términos de servicio y política de privacidad. Tu tarjeta será procesada de forma segura por Stripe.
                                </p>
                            </div>
                        </div>
                    </div>

                    {/* Logos de confianza al pie */}
                    <div className="mt-12 flex gap-8 grayscale opacity-30">
                         <div className="font-bold text-sm tracking-tighter">VISA</div>
                         <div className="font-bold text-sm tracking-tighter">Mastercard</div>
                         <div className="font-bold text-sm tracking-tighter">Stripe</div>
                         <div className="font-bold text-sm tracking-tighter">SSL Secure</div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 4. APP PRINCIPAL
        // ==========================================

        const App = () => {
            const [phase, setPhase] = useState(() => sessionStorage.getItem('dev_phase') || (sessionStorage.getItem('skipIntro') === 'true' ? 'format' : 'intro'));
            const [phaseHistory, setPhaseHistory] = useState(() => JSON.parse(sessionStorage.getItem('dev_phaseHistory')) || []);
            const [treeProgress, setTreeProgress] = useState(() => JSON.parse(sessionStorage.getItem('dev_treeProgress')) || { format: 0, audience: 0 });
            
            const [treeStates, setTreeStates] = useState(() => JSON.parse(sessionStorage.getItem('dev_treeStates')) || {
                format: { currentParent: null, history: [] },
                audience: { currentParent: null, history: [] }
            });
            
            const [globalData, setGlobalData] = useState(() => JSON.parse(sessionStorage.getItem('dev_globalData')) || {
                formatId: null, logistics: null, audienceId: null, objective: null, tones: [], n4: null
            });

            useEffect(() => { sessionStorage.setItem('dev_phase', phase); }, [phase]);
            useEffect(() => { sessionStorage.setItem('dev_phaseHistory', JSON.stringify(phaseHistory)); }, [phaseHistory]);
            useEffect(() => { sessionStorage.setItem('dev_treeProgress', JSON.stringify(treeProgress)); }, [treeProgress]);
            useEffect(() => { sessionStorage.setItem('dev_treeStates', JSON.stringify(treeStates)); }, [treeStates]);
            useEffect(() => { sessionStorage.setItem('dev_globalData', JSON.stringify(globalData)); }, [globalData]);

            const getProgress = () => {
                if (phase === 'intro') return 5;
                if (phase === 'format') return 5 + (10 * treeProgress.format); 
                if (phase === 'secret1') return 15; 
                if (phase === 'logistics') return 20;
                if (phase === 'calc') return 25;
                if (phase === 'calc_fallback') return 25;
                if (phase === 'audience') return 25 + (15 * treeProgress.audience); 
                if (phase === 'objective') return 45;
                if (phase === 'occasion') return 40 + (15 * treeProgress.occasion); 
                if (phase === 'secret2') return 60; 
                if (phase === 'tones') return 75;
                if (phase === 'n4') return 80;
                if (phase === 'secret3') return 90;
                if (phase === 'checkout') return 100;
                return 0;
            };

            const advanceTo = (newPhase, dataUpdate = {}) => {
                sessionStorage.setItem('skipIntro', 'true');
                if (dataUpdate) {
                    setGlobalData(prev => ({ ...prev, ...dataUpdate }));
                }
                setPhaseHistory(prev => [...prev, phase]);
                setPhase(newPhase);
            };

            const goBackPhase = () => {
                if (phaseHistory.length > 0) {
                    const newHistory = [...phaseHistory];
                    const prev = newHistory.pop();
                    setPhaseHistory(newHistory);
                    setPhase(prev);
                }
            };

            return (
                <div className="w-full relative min-h-screen">
                    
                    {phase === 'intro' && <IntroCinematic onComplete={() => advanceTo('format')} />}
                    
                    {/* Árbol 1: FORMATO */}
                    {phase === 'format' && <TreeEngine 
                        treeKey="format" treeStates={treeStates} setTreeStates={setTreeStates}
                        initialTitle="¿Qué formato prefieres?" data={dbFormat} 
                        onProgressUpdate={(pct) => setTreeProgress(p => ({...p, format: pct}))}
                        progress={getProgress()}
                        onComplete={(id, customValue) => {
                            const dataUpdate = { formatId: id };
                            if (customValue) dataUpdate.formatCustomPlace = customValue;
                            advanceTo('secret1', dataUpdate);
                        }} 
                        onBack={null} // Desactiva la navegación hacia la intro en la primera pregunta
                    />}
                    
                    {/* SECRETO 1: Antes de logística */}
                    {phase === 'secret1' && <SecretReward secretIndex={0} progress={getProgress()} onComplete={() => advanceTo('logistics')} onBack={goBackPhase} />}
                    
                    {phase === 'logistics' && <LogisticsForm contextId={globalData.formatId} initialData={globalData.logistics} progress={getProgress()}
                        onComplete={data => {
                            if (globalData.formatId?.includes('digital')) {
                                advanceTo('audience', {logistics: data});
                            } else {
                                advanceTo('calc', {logistics: data});
                            }
                        }} 
                        onBack={goBackPhase} />
                    }
                    
                    {phase === 'calc' && <Calculation data={globalData.logistics} formatId={globalData.formatId} progress={getProgress()}
                        onComplete={(forceDigital) => {
                            if(forceDigital) {
                                advanceTo('audience', { formatId: 'cartas_digitales_en_un_restaurante' }); 
                            } else {
                                advanceTo('audience');
                            }
                        }} 
                        onBack={goBackPhase}
                    />}
                    
                    {/* Árbol 2: AUDIENCIA */}
                    {phase === 'audience' && <TreeEngine 
                        treeKey="audience" treeStates={treeStates} setTreeStates={setTreeStates}
                        initialTitle="¿Con quién es la cena?" data={dbAudience} 
                        onProgressUpdate={(pct) => setTreeProgress(p => ({...p, audience: pct}))}
                        progress={getProgress()}
                        onComplete={id => advanceTo('objective', {audienceId: id})} 
                        onBack={goBackPhase} 
                    />}
                    
                    {phase === 'objective' && <ObjectiveScreen progress={getProgress()} onComplete={txt => advanceTo('secret2', {objective: txt})} onBack={goBackPhase} />}

                    {phase === 'secret2' && <SecretReward secretIndex={1} progress={getProgress()} onComplete={() => advanceTo('tones')} onBack={goBackPhase} />}
                    
                    {phase === 'tones' && <TonesNoria onComplete={sel => advanceTo('n4', {tones: sel})} progress={getProgress()} onBack={goBackPhase} />}
                    
                    {phase === 'n4' && <CustomizationN4 globalData={globalData} progress={getProgress()} onComplete={data => advanceTo('secret3', {n4: data})} onBack={goBackPhase} />}
                    
                    {phase === 'secret3' && <SecretReward secretIndex={2} progress={getProgress()} onComplete={() => advanceTo('checkout')} onBack={goBackPhase} />}

                    {phase === 'checkout' && <Checkout globalData={globalData} progress={getProgress()} onBack={goBackPhase} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
