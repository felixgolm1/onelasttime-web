                                    <div className="flex items-center gap-3">
                                        <div className="w-12 h-12 bg-black rounded-lg flex items-center justify-center p-2.5">
                                            <img src="assets/img/logo one last time.png" alt="One Last Time" className="w-full h-full object-contain" style={{ filter: 'brightness(0) invert(1)' }} />
                                        </div>
                                        <div>
                                            <p className="font-semibold text-sm">Sensibles: {formatName}</p>
                                            <p className="text-xs text-gray-400 italic">Personalizado para: {audLabel}</p>
                                        </div>
                                    </div>
                                    <p className="font-bold text-gray-900">{price}</p>
                                </div>
                                
                                <div className="space-y-2">
                                    <div className="flex justify-between text-sm text-gray-500">
                                        <span>{isDigital ? 'Envío Inmediato (Email/Web)' : `Envío a ${globalData.logistics?.ciudad || 'tu zona'}`}</span>
                                        <span className="text-green-600 font-medium">Gratis</span>
                                    </div>
                                    <div className="flex justify-between items-center text-2xl font-black pt-4 border-t border-gray-200 text-black">
                                        <span>Total</span>
                                        <span className="bg-[#ccff00] px-3 py-1 rounded-lg shadow-sm">{price}</span>
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center gap-4 text-xs text-gray-400 font-medium uppercase tracking-wider">
                                <div className="flex items-center gap-1">🔒 100% Seguro</div>
                            </div>
                        </div>
                    </div>

                    <div className="mt-12 flex gap-8 grayscale opacity-30">
                         <div className="font-bold text-sm tracking-tighter">VISA</div>
                         <div className="font-bold text-sm tracking-tighter">Mastercard</div>
                         <div className="font-bold text-sm tracking-tighter">Stripe</div>
                         <div className="font-bold text-sm tracking-tighter">SSL Secure</div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 4. APP PRINCIPAL
        // ==========================================

        
        const formatExampleText = (text) => {
            if (!text) return null;
            const splitToken = "... [Especifica tanto como quieras]";
            if (text.includes(splitToken)) {
                const parts = text.split(splitToken);
                return (
                    <React.Fragment>
                        {parts[0]}... <span className="not-italic opacity-80">[Especifica tanto como quieras]</span>
                    </React.Fragment>
                );
            }
            return text;
        };

        const App =  () => {
            const urlParams = new URLSearchParams(window.location.search);
            const redirectStatus = urlParams.get('redirect_status');
            const forceSkip = urlParams.get('skipIntro') === 'true';
            
            if (forceSkip && !redirectStatus && !sessionStorage.getItem('forceSkipApplied')) {
                // Clear session storage if coming fresh from landing page
                sessionStorage.removeItem('dev_phase');
                sessionStorage.removeItem('dev_phaseHistory');
                sessionStorage.removeItem('dev_treeProgress');
                sessionStorage.removeItem('dev_treeStates');
                sessionStorage.removeItem('dev_globalData');
                sessionStorage.removeItem('dev_n4_subStep');
                sessionStorage.removeItem('dev_n4_time');
                sessionStorage.removeItem('dev_n4_age');
                sessionStorage.removeItem('dev_n4_extra');
                sessionStorage.setItem('skipIntro', 'true');
                sessionStorage.setItem('forceSkipApplied', 'true'); // Only do this once per navigation
            }
            
            const [phase, setPhase] = useState(() => {
                if (redirectStatus) return 'checkout';
                if (forceSkip) return 'format';
                return sessionStorage.getItem('dev_phase') || 'format';
            });
            const [phaseHistory, setPhaseHistory] = useState(() => JSON.parse(sessionStorage.getItem('dev_phaseHistory')) || []);
            const [treeProgress, setTreeProgress] = useState(() => JSON.parse(sessionStorage.getItem('dev_treeProgress')) || { format: 0, audience: 0 });
            
                        const globalBackRef = React.useRef(null);
            const calculateGlobalSubtitle = () => {
                if (phase === 'format' && !treeStates.format.currentParent && treeStates.format.history.length === 0) return '';
                
                if (window.__globalFormatId) {
                    if (window.__globalFormatId.includes('cartas_digitales')) return 'Versión digital';
                    else if (window.__globalFormatId.includes('cartas_fisicas')) return 'Versión física';
                }
                return '';
            };
            const [treeStates, setTreeStates] = useState(() => JSON.parse(sessionStorage.getItem('dev_treeStates')) || {
                format: { currentParent: null, history: [] },
                audience: { currentParent: null, history: [] }
            });
            
            const [globalData, setGlobalData] = useState(() => JSON.parse(sessionStorage.getItem('dev_globalData')) || {
                formatId: null, logistics: null, audienceId: null, objective: null, tones: [], n4: null
            });
            window.__globalFormatId = globalData.formatId;

            useEffect(() => { sessionStorage.setItem('dev_phase', phase); }, [phase]);
            useEffect(() => { sessionStorage.setItem('dev_phaseHistory', JSON.stringify(phaseHistory)); }, [phaseHistory]);
            useEffect(() => { sessionStorage.setItem('dev_treeProgress', JSON.stringify(treeProgress)); }, [treeProgress]);
            useEffect(() => { sessionStorage.setItem('dev_treeStates', JSON.stringify(treeStates)); }, [treeStates]);
            useEffect(() => { sessionStorage.setItem('dev_globalData', JSON.stringify(globalData)); }, [globalData]);

            const getProgress = () => {
                if (phase === 'intro') return 5;
                if (phase === 'format') return 5 + (15 * treeProgress.format); 
                if (phase === 'logistics') return 20;
                if (phase === 'contact_info') return 21;
                if (phase === 'participants') return 22;
                if (phase === 'delivery_error') return 25;
                if (phase === 'audience') return 25 + (15 * treeProgress.audience); 
                if (phase === 'objective') return 45;
                if (phase === 'tones') return 75;
                if (phase === 'n4') return 90;
                if (phase === 'checkout') return 100;
                return 0;
            };

            const advanceTo = (newPhase, dataUpdate = {}) => {
                sessionStorage.setItem('skipIntro', 'true');
                setPhaseHistory(prev => [...prev, { phase, globalData }]);
                if (dataUpdate) {
                    setGlobalData(prev => ({ ...prev, ...dataUpdate }));
                }
                setPhase(newPhase);
            };

            const goBackPhase = (partialData) => {
                let latestData = { ...globalData };
                if (partialData && typeof partialData === 'object' && !partialData.nativeEvent) {
                    latestData = { ...latestData, ...partialData };
                }
                
                if (phaseHistory.length > 0) {
                    let newHistory = [...phaseHistory];
                    let prev = newHistory.pop();
                    
                    setPhaseHistory(newHistory);
                    
                    if (typeof prev === 'object' && prev !== null) {
                        setPhase(prev.phase);
                        // Restore routing IDs from history so back button correctly reverts format changes
                        if (prev.globalData) {
                            latestData.formatId = prev.globalData.formatId;
                            latestData.audienceId = prev.globalData.audienceId;
                        }
                    } else {
                        // Retrocompatibilidad con strings
                        setPhase(prev);
                    }
                }
                
                setGlobalData(latestData);
            };

            return (
                <div className="w-full relative min-h-screen flex flex-col">
                    <div className="flex-1 w-full flex flex-col relative transition-all duration-500 ease-in-out" style={{ paddingTop: calculateGlobalSubtitle() ? '22px' : '0px' }}>
                    
                    {phase !== 'intro' && (
                        <GlobalHeader 
                            progress={getProgress()} 
                            onBack={() => { if (globalBackRef.current) globalBackRef.current(); else goBackPhase(); }} 
                            animateIn={phase === 'format' && treeStates.format.history.length === 0} 
                            overrideSubtitle={calculateGlobalSubtitle()} 
                            isCheckout={phase === 'checkout'}
                            isDigital={window.__globalFormatId?.includes('digital')}
                        />
                    )}

                    {phase === 'intro' && <IntroCinematic onComplete={() => advanceTo('format')} />}
                    
                    {/* Árbol 1: FORMATO */}
                    {phase === 'format' && <TreeEngine 
                        treeKey="format" treeStates={treeStates} setTreeStates={setTreeStates} backRef={globalBackRef}
                        initialTitle="¿Qué formato prefieres?" data={dbFormat} 
                        onProgressUpdate={(pct) => setTreeProgress(p => ({...p, format: pct}))}
                        progress={getProgress()}
                        onComplete={(id, customValue) => {
                            const dataUpdate = { formatId: id };
                            if (customValue) dataUpdate.formatCustomPlace = customValue;
                            advanceTo('logistics', dataUpdate);
                        }} 
                        onBack={null} // Desactiva la navegación hacia la intro en la primera pregunta
                    />}
                    
                    {phase === 'logistics' && <LogisticsForm backRef={globalBackRef} key={globalData.formatId} contextId={globalData.formatId} initialData={globalData.logistics} globalContactData={globalData.contact} progress={getProgress()}
                        onSwitchToDigital={(currentForm) => advanceTo('logistics', { formatId: globalData.formatId.replace('fisicas', 'digitales'), logistics: currentForm })}
                        onComplete={data => {
                            if (globalData.formatId?.includes('digital')) {
                                advanceTo('participants', {logistics: data});
                            } else {
                                const isBcn = isBarcelonaCity(data.direccion || data.punto_recogida || data.ciudad_restaurante);
                                const reqHours = isBcn ? 4 : 48;
                                
                                const eventDate = new Date(data.fecha);
                                const now = new Date();
                                const hoursDiff = (eventDate - now) / (1000 * 60 * 60);
                                
                                if (hoursDiff >= reqHours) {
                                    advanceTo('contact_info', {logistics: data});
                                } else {
                                    advanceTo('delivery_error', {logistics: data, isBcn, reqHours});
                                }
                            }
                        }} 
                        onBack={goBackPhase} />
                    }
                    
                    {phase === 'delivery_error' && <DeliveryErrorScreen 
                        isBcn={globalData.isBcn} 
                        reqHours={globalData.reqHours} 
                        progress={getProgress()}
                        onDigital={() => advanceTo('logistics', { formatId: globalData.formatId.replace('fisicas', 'digitales') })} 
                        onChangeDate={goBackPhase} 
                        onBack={goBackPhase}
                    />}
                    
                    
                    {phase === 'contact_info' && <ContactInfoScreen 
                        progress={getProgress()}
                        globalData={globalData}
                        backRef={globalBackRef}
                        onComplete={data => advanceTo('participants', { contact: data })} 
                        onBack={goBackPhase} 
                    />}
                    
                    {phase === 'participants' && <ParticipantsScreen 
                        progress={getProgress()}
                        globalData={globalData}
                        onComplete={data => advanceTo('audience', { participants: data })} 
                        onBack={goBackPhase}
                        backRef={globalBackRef}
                    />}
                    
                    {/* Árbol 2: AUDIENCIA */}
                    {phase === 'audience' && <TreeEngine 
                        treeKey="audience" treeStates={treeStates} setTreeStates={setTreeStates} backRef={globalBackRef}
                        initialTitle="¿Con quién es la cena?" data={dbAudience} 
                        onProgressUpdate={(pct) => setTreeProgress(p => ({...p, audience: pct}))}
                        progress={getProgress()}
                        onComplete={id => advanceTo('objective', {audienceId: id})} 
                        onBack={goBackPhase} 
                    />}
                    
                    {phase === 'objective' && <ObjectiveScreen progress={getProgress()} globalData={globalData} onComplete={txt => advanceTo('tones', {objective: txt})} onBack={goBackPhase} backRef={globalBackRef} />}

                    {phase === 'tones' && <TonesNoria globalData={globalData} onComplete={sel => advanceTo('n4', {tones: sel})} progress={getProgress()} onBack={goBackPhase} backRef={globalBackRef} />}
                    
                    {phase === 'n4' && <CustomizationN4 backRef={globalBackRef} globalData={globalData} progress={getProgress()} onComplete={data => advanceTo('checkout', {n4: data})} onBack={goBackPhase} />}

                    {phase === 'checkout' && <Checkout globalData={globalData} progress={getProgress()} onBack={goBackPhase} />}
                    </div>
                </div>
            );
        };

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null, errorInfo: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true };
            }
            componentDidCatch(error, errorInfo) {
                this.setState({ error, errorInfo });
                console.error(error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div style={{ padding: '20px', backgroundColor: 'black', color: 'red', minHeight: '100vh', fontFamily: 'monospace' }}>
                            <h1 style={{color:'white'}}>Something went wrong.</h1>
                            <details style={{ whiteSpace: 'pre-wrap' }}>
                                {this.state.error && this.state.error.toString()}
                                <br />
                                {this.state.errorInfo && this.state.errorInfo.componentStack}
                            </details>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
