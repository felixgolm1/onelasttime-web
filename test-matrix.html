<!DOCTYPE html><html><body><p id="intro-matrix-text" style="color:black">original</p><script>const introMatrix = document.getElementById("intro-matrix-text");const finalStr = "conexiones significativas para personas que importan";let initHtml = "";for (let i = 0; i < finalStr.length; i++) {if (finalStr[i] === " ") initHtml += " ";else initHtml += `<span style="opacity:0">${finalStr[i]}</span>`;}introMatrix.innerHTML = initHtml;const totalDuration = 1200;const glyphs = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#*+^~!";let startTime = Date.now();setTimeout(() => {startTime = Date.now();const timer = setInterval(() => {const elapsed = Date.now() - startTime;let p = Math.min(1, Math.max(0, elapsed / totalDuration));let html = "";for (let i = 0; i < finalStr.length; i++) {const charP = i / finalStr.length;if (finalStr[i] === " ") {html += " ";} else if (p >= charP + 0.15) {html += `<span style="color:rgba(0,0,0,0.85)">${finalStr[i]}</span>`;} else if (p > charP) {const r = Math.floor(Math.random() * glyphs.length);html += `<span style="color:#a3cc00">${glyphs[r]}</span>`;} else {html += `<span style="opacity:0">${finalStr[i]}</span>`;}}introMatrix.innerHTML = html;if (p >= 1) {clearInterval(timer);introMatrix.innerHTML = finalStr;console.log("Done");}}, 30);}, 200);</script></body></html>
